# Sends each person's morning email from the planner (see api/digest/index.js).
#
# Set two repository secrets (Settings > Secrets and variables > Actions):
#   PORTAL_BASE_URL   the site's address, e.g. https://kind-smoke-0153bb410.5.azurestaticapps.net (already used by Portal reminders)
#   DIGEST_KEY        the same value as the DIGEST_KEY setting in Azure (a long random string)
# Until both are set this does nothing. Whether it sends, and to whom, is set in the planner.
name: Morning email

on:
  schedule:
    - cron: "41 5 * * *"  # 05:41 UTC: 05:41 in winter, 06:41 in summer
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send today's digests
        env:
          PORTAL_BASE_URL: ${{ secrets.PORTAL_BASE_URL }}
          DIGEST_KEY: ${{ secrets.DIGEST_KEY }}
        run: |
          if [ -z "$PORTAL_BASE_URL" ] || [ -z "$DIGEST_KEY" ]; then
            echo "Not set up yet: add the PORTAL_BASE_URL and DIGEST_KEY secrets."
            exit 0
          fi
          code=$(curl -sS -o result.json -w "%{http_code}" -X POST "${PORTAL_BASE_URL%/}/api/digest/run" -H "x-digest-key: $DIGEST_KEY" --max-time 120)
          cat result.json; echo
          [ "$code" = "200" ]
